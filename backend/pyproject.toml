[project]
name = "researching-os-backend"
version = "0.1.0"
description = "Multi-agent research engine backend using FastAPI and Gemini API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.26.0",
    "pypdf>=4.0.0",
    "langgraph>=1.2.11",
    "dspy-ai>=3.3.0",
    "openai>=1.50.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scratch", ".venv", "node_modules"]
# langsmith registers a pytest plugin via entry_points that pytest autoloads
# at session start, before any test file is collected. On this iCloud-backed
# repo that plugin's own init makes collection hang indefinitely (previously
# reported as "the full suite hung for 4+ minutes with no result"). No test or
# application code here uses the langsmith pytest plugin -- backend/main.py
# already stubs the langsmith *library* import for the same slowness reason
# (backend/_langsmith_stub.py); this addresses pytest's separate, independent
# autoload of it as a plugin.
addopts = "-p no:langsmith"
